steps:
  # Export a Firestore snapshot so the Docker build's prerender bakes real
  # catalogue data into the static shell (the build SA reads via REST —
  # metadata-server token, no keys in the image).
  - name: node:22-slim
    entrypoint: node
    args:
      - infra/scripts/export-storefront-snapshot.mjs
    env:
      - GCP_PROJECT=daedalus-store
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-north1-docker.pkg.dev/daedalus-store/storefront/storefront:latest
      - -f
      - infra/docker/storefront.Dockerfile
      - .
images:
  - europe-north1-docker.pkg.dev/daedalus-store/storefront/storefront:latest
